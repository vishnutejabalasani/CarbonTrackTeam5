spring.application.name=carbontrack-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/carbontrackdb?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations
app.jwt.secret=${JWT_SECRET:CarbonTrackSecretKeyCarbonTrackSecretKey12345}
app.jwt.expiration-ms=86400000

# Flyway
spring.flyway.baseline-on-migrate=true
# Security Logging
logging.level.org.springframework.security=DEBUG

# Cache Configurations
spring.cache.type=${SPRING_CACHE_TYPE:simple}

# Enable developer login bypass locally
app.auth.allow-dev-bypass=true

# Google Gemini API Config
app.gemini.api-key=${GEMINI_API_KEY:}
